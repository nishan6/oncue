name: Build and test

on:
  push:
    branches-ignore: ["soak/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p ci-logs
          { sw_vers; xcodebuild -version; swift --version; uname -m; } 2>&1 | tee ci-logs/toolchain.log

      - name: Install XcodeGen
        run: brew install xcodegen 2>&1 | tail -n 5; xcodegen --version | tee -a ci-logs/toolchain.log

      - name: Generate Xcode project from project.yml
        id: generate
        run: |
          xcodegen generate --spec project.yml 2>&1 | tee ci-logs/xcodegen.log
          if [ -n "$(git status --porcelain -- OnCue.xcodeproj)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Committed OnCue.xcodeproj differs from project.yml (or is missing):" | tee -a ci-logs/xcodegen.log
            git status --porcelain -- OnCue.xcodeproj | tee -a ci-logs/xcodegen.log
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Committed OnCue.xcodeproj matches project.yml." | tee -a ci-logs/xcodegen.log
          fi

      - name: OnCueCore package tests
        id: tests
        continue-on-error: true
        run: swift test --package-path Packages/OnCueCore 2>&1 | tee ci-logs/swift-test.log

      - name: Build OnCue.app
        id: build
        continue-on-error: true
        run: |
          xcodebuild -project OnCue.xcodeproj -scheme OnCue -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            build 2>&1 | tee ci-logs/xcodebuild.log
          grep -E "warning:" ci-logs/xcodebuild.log | sort -u > ci-logs/xcodebuild-warnings.log || true

      - name: Launch smoke test (create, save, close, reopen a show)
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          APP="build/DerivedData/Build/Products/Debug/OnCue.app"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee ci-logs/codesign.log
          SMOKE="$RUNNER_TEMP/smoke"
          "$APP/Contents/MacOS/OnCue" --smoke-test "$SMOKE" 2>&1 | tee ci-logs/smoke.log
          cp "$SMOKE/smoke-result.txt" ci-logs/ 2>/dev/null || true
          cp "$SMOKE/smoke.oncue" ci-logs/smoke-saved-show.json 2>/dev/null || true
          grep -q "PASS:" ci-logs/smoke.log

      - name: Screenshots of the running app
        id: screenshots
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          APP="build/DerivedData/Build/Products/Debug/OnCue.app"
          SHOTS="$RUNNER_TEMP/screenshots"
          "$APP/Contents/MacOS/OnCue" --screenshots "$SHOTS" 2>&1 | tee ci-logs/screenshots.log
          mkdir -p ci-logs/screenshots
          cp "$SHOTS"/*.png ci-logs/screenshots/ 2>/dev/null || true
          cp "$SHOTS"/export-* ci-logs/screenshots/ 2>/dev/null || true
          screencapture -x ci-logs/screenshots/full-screen-after.png 2>/dev/null || true
          grep -q "PASS:" ci-logs/screenshots.log

      - name: Package the DMG (Release build)
        id: dmg
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          # Optional repository secrets for a Developer ID signed and notarized DMG.
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY_SECRET: ${{ secrets.SIGN_IDENTITY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          # Or an App Store Connect API key (preferred): the .p8 file base64-encoded, its key id and issuer id.
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # A v1.2.3 tag sets the version, and a release must be signed and notarised.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}" REQUIRE_NOTARIZED=1
          fi
          if [ -n "$NOTARY_KEY_P8" ]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          if [ -n "$DEVELOPER_ID_P12" ] && [ -n "$SIGN_IDENTITY_SECRET" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p ci "$KEYCHAIN"
            security set-keychain-settings -lut 3600 "$KEYCHAIN"
            security unlock-keychain -p ci "$KEYCHAIN"
            echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
            security import "$RUNNER_TEMP/id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            export SIGN_IDENTITY="$SIGN_IDENTITY_SECRET"
          fi
          scripts/package-dmg.sh "$RUNNER_TEMP/dist" 2>&1 | tee ci-logs/dmg.log
          ls -la "$RUNNER_TEMP/dist" | tee -a ci-logs/dmg.log
          ls "$RUNNER_TEMP"/dist/*.dmg >/dev/null

      - name: Keep the DMG
        if: steps.dmg.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OnCue-dmg-${{ github.sha }}
          path: ${{ runner.temp }}/dist/*.dmg
          retention-days: 30

      - name: Publish a release for version tags
        if: steps.dmg.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "${GITHUB_REF_NAME}" "$RUNNER_TEMP"/dist/*.dmg --title "OnCue ${GITHUB_REF_NAME#v}" --notes-file "$NOTES"
          else
            gh release create "${GITHUB_REF_NAME}" "$RUNNER_TEMP"/dist/*.dmg --title "OnCue ${GITHUB_REF_NAME#v}" --generate-notes
          fi

      - name: Commit regenerated Xcode project
        if: >-
          steps.generate.outputs.changed == 'true' && steps.build.outcome == 'success' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the run for the newest commit on main may commit; an older run whose commit has
          # been superseded skips (the newer run regenerates and commits instead).
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved on since $GITHUB_SHA; skipping, the newer run will commit the project."
            exit 0
          fi
          git add OnCue.xcodeproj
          git commit -m "Regenerate OnCue.xcodeproj from project.yml"
          git push origin HEAD:main

      - name: Publish logs to the ci-results branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Never abort while collecting logs: a failed build leaves some files missing.
          set +e +o pipefail
          SHORT="${GITHUB_SHA::7}"
          {
            echo "# CI results for $SHORT"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Generate project | ${{ steps.generate.outcome }} (project changed: ${{ steps.generate.outputs.changed }}) |"
            echo "| Package tests | ${{ steps.tests.outcome }} |"
            echo "| App build | ${{ steps.build.outcome }} |"
            echo "| Launch smoke test | ${{ steps.smoke.outcome }} |"
            echo "| Screenshots | ${{ steps.screenshots.outcome }} |"
            echo "| DMG | ${{ steps.dmg.outcome }} |"
            echo
            echo "## Toolchain"; echo '```'; cat ci-logs/toolchain.log 2>/dev/null; echo '```'
            echo "## Test summary"; echo '```'
            grep -E "Executed|error:|failed|passed" ci-logs/swift-test.log 2>/dev/null | tail -n 60; echo '```'
            echo "## Build result"; echo '```'
            grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" ci-logs/xcodebuild.log 2>/dev/null | sort -u | head -n 80; echo '```'
            echo "## Warnings ($(wc -l < ci-logs/xcodebuild-warnings.log 2>/dev/null || echo 0))"; echo '```'
            cat ci-logs/xcodebuild-warnings.log 2>/dev/null | head -n 80; echo '```'
            echo "## Smoke test"; echo '```'; cat ci-logs/smoke.log 2>/dev/null; echo '```'
            echo "## DMG"; echo '```'; tail -n 15 ci-logs/dmg.log 2>/dev/null; echo '```'
          } > ci-logs/SUMMARY.md
          cat ci-logs/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP"
          if ! git clone --quiet --depth 1 --branch ci-results "$URL" results 2>/dev/null; then
            mkdir results && cd results && git init --quiet && git checkout --quiet -b ci-results && cd ..
          fi
          cd results
          mkdir -p "runs/$SHORT"
          cp -R "$GITHUB_WORKSPACE/ci-logs/." "runs/$SHORT/"
          cp "$GITHUB_WORKSPACE/ci-logs/SUMMARY.md" LATEST.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "CI results for $SHORT"
          for i in 1 2 3; do
            git push --quiet "$URL" HEAD:ci-results && break
            git pull --quiet --rebase "$URL" ci-results || true
          done

      - name: Fail the job if any check failed
        if: always()
        run: |
          fail=0
          [ "${{ steps.tests.outcome }}" = "success" ] || { echo "Package tests failed"; fail=1; }
          [ "${{ steps.build.outcome }}" = "success" ] || { echo "App build failed"; fail=1; }
          [ "${{ steps.smoke.outcome }}" = "success" ] || { echo "Launch smoke test failed or did not run"; fail=1; }
          [ "${{ steps.dmg.outcome }}" = "success" ] || { echo "DMG packaging failed or did not run"; fail=1; }
          exit $fail
